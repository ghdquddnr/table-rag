[project]
name = "table-rag"
version = "0.1.0"
description = "표·숫자에 강한 한국어 하이브리드 RAG (pgvector + pg_trgm, RRF)"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "markitdown>=0.0.1a2",
    "FlagEmbedding>=1.3.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "ollama>=0.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E501", "B008", "B904"]  # HTML 인라인 스트링 + FastAPI File()/Form() 패턴 + except-raise 체인
"src/index/ingest.py" = ["E501"]  # SQL 인라인 스트링의 긴 줄 허용
"eval/make_fixture.py" = ["E501"]  # SQL 인라인 스트링의 긴 줄 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
